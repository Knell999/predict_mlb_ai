services:
  mlb-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mlb-predict-ai
    ports:
      - "8501:8501"
    volumes:
      # Mount data directory for live updates
      - ./data:/app/data
      # Mount logs directory for persistence
      - ./logs:/app/logs
    environment:
      # AI API key (optional - app works without it)
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY:-}
      # Logging level
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  mlb-data:
  mlb-logs:
